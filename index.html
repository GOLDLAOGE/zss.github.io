  <script>
    function parseQueryString(url) {
      var obj = {};
      var idx = url.indexOf("?");
      if (idx < 0) return obj;
      var paraString = url.substring(idx + 1).split("#")[0].split("&");
      for (var i = 0; i < paraString.length; i++) {
        var kv = paraString[i].split("=");
        if (!kv[0]) continue;
        try { obj[kv[0]] = decodeURIComponent(kv[1] || ""); }
        catch (err) { obj[kv[0]] = kv[1] || ""; }
      }
      return obj;
    }

    var queryObj = parseQueryString(location.href);
  </script>

  <style>
    :root {
      --green: #07c160;
      --green-dark: #06ad56;
      --green-soft: #e8f8ef;
      --ink: #1d2129;
      --muted: #86909c;
      --line: #eef0f3;
      --bg: #f4f6f8;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      padding: 0 16px calc(32px + env(safe-area-inset-bottom));
    }

    /* ---------- 頂部 ---------- */
    .hero {
      position: relative;
      margin: 0 -16px;
      padding: 44px 16px 92px;
      text-align: center;
      color: #fff;
      background: linear-gradient(160deg, #0bd46e 0%, #07c160 45%, #05a854 100%);
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
    }

    .hero::before { width: 260px; height: 260px; top: -120px; right: -80px; }
    .hero::after  { width: 180px; height: 180px; bottom: -60px; left: -60px; }

    .logo {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
    }

    .logo svg { width: 40px; height: 40px; }

    .hero h1 {
      position: relative;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .5px;
    }

    .hero p {
      position: relative;
      margin-top: 6px;
      font-size: 14px;
      opacity: .9;
    }

    /* ---------- 卡片 ---------- */
    .card {
      position: relative;
      max-width: 420px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(15, 35, 25, .06);
    }

    .id-card {
      margin-top: -64px;
      padding: 24px 20px 22px;
      text-align: center;
    }

    .label {
      font-size: 13px;
      color: var(--muted);
    }

    .wx-box {
      margin: 10px 0 18px;
      padding: 14px 12px;
      border: 1px dashed #b9e9cf;
      border-radius: 12px;
      background: var(--green-soft);
    }

    .wx {
      display: block;
      font-size: 26px;
      font-weight: 700;
      color: var(--green-dark);
      letter-spacing: 1px;
      word-break: break-all;
      -webkit-user-select: all;
      user-select: all;
    }

    .btn-copy {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 25px;
      background: var(--green);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(7, 193, 96, .3);
      transition: transform .15s, background .2s, box-shadow .2s;
      animation: pulse 2.2s ease-in-out infinite;
    }

    .btn-copy:active { transform: scale(.97); background: var(--green-dark); }
    .btn-copy svg { width: 20px; height: 20px; }

    .btn-copy.done {
      animation: none;
      background: #fff;
      color: var(--green);
      box-shadow: inset 0 0 0 1.5px var(--green);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 18px rgba(7, 193, 96, .3), 0 0 0 0 rgba(7, 193, 96, .35); }
      50%      { box-shadow: 0 8px 18px rgba(7, 193, 96, .3), 0 0 0 10px rgba(7, 193, 96, 0); }
    }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    /* ---------- 步驟 ---------- */
    .steps-card {
      margin-top: 14px;
      padding: 20px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 16px;
      border-radius: 2px;
      background: var(--green);
    }

    .steps { list-style: none; }

    .steps li {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 18px;
      font-size: 14px;
      line-height: 24px;
      text-align: left;
    }

    .steps li:last-child { padding-bottom: 0; }

    .steps li:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 11.5px;
      top: 28px;
      bottom: 4px;
      width: 1px;
      background: var(--line);
    }

    .num {
      flex: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      line-height: 24px;
    }

    .steps b { color: var(--green-dark); font-weight: 600; }

    .demo {
      margin-top: 18px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fff;
    }

    .demo svg { display: block; width: 100%; height: auto; }

    /* 演示動畫：12 秒一個循環 */
    .demo .anim { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .sc-menu  { animation-name: scMenu; opacity: 0; }
    .sc-page  { animation-name: scPage; opacity: 0; }
    .sc-prof  { animation-name: scProf; opacity: 0; }
    .paste    { animation-name: paste;  opacity: 0; }
    .typed    { animation-name: typed;  opacity: 0; }
    .tap      { transform-box: fill-box; transform-origin: center; opacity: 0; }
    .tap1 { animation-name: tap1; }
    .tap2 { animation-name: tap2; }
    .tap3 { animation-name: tap3; }
    .tap4 { animation-name: tap4; }
    .tap5 { animation-name: tap5; }
    .cursor { animation: blink 1s steps(1) infinite; }

    @keyframes scMenu { 0%, 24% { opacity: 0 } 26%, 48% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes scPage { 0%, 49% { opacity: 0 } 51%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes scProf { 0%, 74% { opacity: 0 } 76%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes paste  { 0%, 52% { opacity: 0 } 53.5%, 59% { opacity: 1 } 60%, 100% { opacity: 0 } }
    @keyframes typed  { 0%, 59% { opacity: 0 } 61%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes tap1 { 0%, 15% { opacity: 0; transform: scale(.3) } 17% { opacity: 1; transform: scale(.6) } 22%, 100% { opacity: 0; transform: scale(1.5) } }
    @keyframes tap2 { 0%, 40% { opacity: 0; transform: scale(.3) } 42% { opacity: 1; transform: scale(.6) } 48%, 100% { opacity: 0; transform: scale(1.5) } }
    @keyframes tap3 { 0%, 55% { opacity: 0; transform: scale(.3) } 56.5% { opacity: 1; transform: scale(.6) } 59.5%, 100% { opacity: 0; transform: scale(1.5) } }
    @keyframes tap4 { 0%, 66% { opacity: 0; transform: scale(.3) } 67.5% { opacity: 1; transform: scale(.6) } 72%, 100% { opacity: 0; transform: scale(1.5) } }
    @keyframes tap5 { 0%, 88% { opacity: 0; transform: scale(.3) } 90% { opacity: 1; transform: scale(.6) } 95%, 100% { opacity: 0; transform: scale(1.5) } }
    @keyframes blink { 0% { opacity: 1 } 50% { opacity: 0 } }

    .step-tag {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #b5bcc6;
    }

    /* ---------- 提示 Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      top: 45%;
      z-index: 99;
      min-width: 150px;
      padding: 18px 22px;
      border-radius: 14px;
      background: rgba(17, 17, 17, .82);
      color: #fff;
      text-align: center;
      font-size: 15px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.9);
      transition: opacity .25s, transform .25s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .toast svg {
      display: block;
      width: 36px;
      height: 36px;
      margin: 0 auto 8px;
    }

    .toast small {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: .75;
    }
  </style>
</head>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/>
    </svg>
    複製成功
    <small id="toastSub">正在打開 WeChat…</small>
  </div>

  <script src="./js/clipboard.min.js"></script>
  <script>
    (function () {
      var wx = (queryObj.w || "").trim();
      var wxEl = document.getElementById("wx");
      var btn = document.getElementById("btnCopy");
      var btnText = document.getElementById("btnText");
      var toast = document.getElementById("toast");
      var toastTimer;

      wxEl.textContent = wx || "——";
      btn.setAttribute("data-clipboard-text", wx);

      // 演示動畫內顯示實際 WeChat ID
      var demoId = document.getElementById("demoId");
      if (demoId && wx) {
        demoId.textContent = wx;
        document.getElementById("demoId2").textContent = wx;
        try {
          document.getElementById("demoCursor").setAttribute("x", 52 + demoId.getComputedTextLength() + 3);
        } catch (err) {}
      }

      /* ---------- 訪客統計 ---------- */
      // 部署統計後台後，把下面換成你的 Cloudflare Worker 地址（結尾是 /e）；留空則不統計
      var STATS_URL = "https://wechat-landing-stats.schmidtdean438.workers.dev/e";

      var VID = (function () {
        var v = "";
        try { v = localStorage.getItem("lp_vid") || ""; } catch (err) {}
        if (!v) {
          v = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
          try { localStorage.setItem("lp_vid", v); } catch (err) {}
        }
        return v;
      })();

      function track(e) {
        if (!STATS_URL) return;
        var body = JSON.stringify({
          e: e,
          vid: VID,
          w: wx,
          src: queryObj.utm_source || queryObj.s || "",
          cmp: queryObj.utm_campaign || queryObj.c || ""
        });
        try {
          if (navigator.sendBeacon && navigator.sendBeacon(STATS_URL, body)) return;
        } catch (err) {}
        try { fetch(STATS_URL, { method: "POST", body: body, keepalive: true, mode: "no-cors" }); } catch (err) {}
      }

      track("view");

      var toastSub = document.getElementById("toastSub");
      var openTimer;
      var awayForWeChat = false;

      // 複製成功後嘗試打開 WeChat（只能打開 App 首頁，無法直接跳到加好友頁）
      function openWeChat() {
        var settled = false;
        function done(ok) {
          if (settled) return;
          settled = true;
          document.removeEventListener("visibilitychange", onHide);
          window.removeEventListener("pagehide", onHide);
          clearTimeout(openTimer);
          if (ok) {
            awayForWeChat = true;
            track("open_ok");
          } else {
            // 沒有成功跳轉（如在 Facebook / Instagram 內置瀏覽器中被攔截）
            track("open_fail");
            btnText.textContent = "已複製，按此打開 WeChat";
            toastSub.textContent = "請手動打開 WeChat 貼上搜尋";
          }
        }
        function onHide(ev) { if (ev.type === "pagehide" || document.hidden) done(true); }
        document.addEventListener("visibilitychange", onHide);
        window.addEventListener("pagehide", onHide);

        try { window.location.href = "weixin://"; } catch (err) {}

        clearTimeout(openTimer);
        openTimer = setTimeout(function () { done(false); }, 1500);
      }

      function onCopied() {
        track("copy");
        btn.classList.add("done");
        btnText.textContent = "已複製，正在打開 WeChat…";
        toastSub.textContent = "正在打開 WeChat…";
        clearTimeout(toastTimer);
        toast.classList.add("show");
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
        openWeChat();
      }

      // 從 WeChat 返回頁面時，按鈕恢復成可再次打開的狀態
      function onBack() {
        if (document.hidden) return;
        if (btn.classList.contains("done")) btnText.textContent = "已複製，按此打開 WeChat";
        if (awayForWeChat) { awayForWeChat = false; track("return"); }
      }
      document.addEventListener("visibilitychange", onBack);
      window.addEventListener("pageshow", onBack);

      function onFailed() {
        track("copy_fail");
        // 複製失敗時選取文字，方便用戶長按複製
        var range = document.createRange();
        range.selectNodeContents(wxEl);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.getElementById("hint").textContent = "自動複製失敗，請長按上方 WeChat ID 手動複製";
      }

      if (window.ClipboardJS && ClipboardJS.isSupported()) {
        var clipboard = new ClipboardJS("#btnCopy");
        clipboard.on("success", function (e) { onCopied(); e.clearSelection(); });
        clipboard.on("error", onFailed);
      } else {
        btn.addEventListener("click", function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(wx).then(onCopied, onFailed);
          } else {
            onFailed();
          }
        });
      }
    })();

    // 保留原頁面的隨機隱藏節點邏輯
    (function () {
      var domApdList = [
        '<div style="display:none;">i love ins</div>',
        '<div style="display:none;">nihao</div>',
        '<div style="display:none;">开心的一天</div>',
        '<div style="display:none;">来了老弟</div>',
        '<div style="display:none;">真好</div>'
      ];
      var r1 = Math.floor(Math.random() * domApdList.length);
      var r2 = Math.floor(Math.random() * domApdList.length);
      document.body.insertAdjacentHTML("beforeend", domApdList[r1]);
      document.body.insertAdjacentHTML("afterbegin", domApdList[r2]);
    })();
  </script>
